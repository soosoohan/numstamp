<button id="lang-toggle" onclick="toggleLang()">English</button>

<script src="levels.js"></script>
<script>
  function toggleLang() {
  const body = document.body;
  const btn = document.getElementById('lang-toggle');
  if (body.classList.contains('ko')) {
    body.classList.replace('ko', 'en');
    document.documentElement.lang = 'en';
    btn.textContent = '한';
    localStorage.setItem('soosoo-lang', 'en'); 
  } else {
    body.classList.replace('en', 'ko');
    document.documentElement.lang = 'ko';
    btn.textContent = 'EN';
    localStorage.setItem('soosoo-lang', 'ko'); 
  }
}
  function initLanguage() {
  const saved = localStorage.getItem('soosoo-lang');
  const lang = saved || (navigator.language.startsWith('ko') ? 'ko' : 'en');
  const body = document.body;
  const btn = document.getElementById('lang-toggle');
  if (lang === 'en') {
    body.classList.replace('ko', 'en');
    document.documentElement.lang = 'en';
    btn.textContent = '한';
  }
}
const grid = document.getElementById('level-grid');
  const STAR_COLORS = ['#f0c040', '#f0900c', '#e6491f']; // 노랑, 주황, 주홍

  LEVEL_IDS.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'level-btn';

    const stars = parseInt(localStorage.getItem(id + '_stars') || '0', 10);
    const num = id.replace('nstamp_', '');

    let starsHTML = '';
    for (let i = 0; i < 3; i++) {
      if (i < stars) {
        starsHTML += `<span style="color:${STAR_COLORS[i]}">★</span>`;
      } else {
        starsHTML += `<span style="color:#555">☆</span>`;
      }
    }

    btn.innerHTML = `${num}<span class="stars">${starsHTML}</span>`;
    if (stars === 3) btn.classList.add('cleared');

    btn.onclick = () => location.href = `play.html?id=${id}`;
    grid.appendChild(btn);
  });
</script>
