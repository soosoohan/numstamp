<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘스탬프 | 수수랜드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
   html, body {
  touch-action: manipulation; 
}
   body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .back-button {
    position: absolute; top: 20px; left: 20px;
    padding: 8px 10px; font-size: 2em; font-weight: bold;
    background: #1a1a2e; color: #CFF9FF;
    border-radius: 12px; border: none; cursor: pointer;
  }
  .back-button:hover { background-color: #1baf8f; color: #fff; }
  h1 { font-size: 1.6rem; color: #f0c040; margin-bottom: 10px; letter-spacing: 2px; }
  
 #lang-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: #2a2a4a;
    border: 1px solid #444;
    border-radius: 20px;
    padding: 6px 14px;
    color: #f0c040;
    font-size: 0.85rem;
    cursor: pointer;
    z-index: 100;
    transition: background 0.2s;
  }
  #lang-toggle:hover { background: #3a3a6a; }

  .lang-ko, .lang-en { transition: opacity 0.2s; }
  body.en .lang-ko { display: none; }
  body.ko .lang-en { display: none; }

 #status-area { margin-bottom: 14px; font-size: 1rem; color: #ccc; text-align: center; }
  #status-area .rocks-left { color: #f0c040; font-weight: bold; }
#queue-area {
  display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-end;
}
.queue-slot { display: flex; flex-direction: column; align-items: center; }
.queue-label { font-size: 1rem; color: #888; margin-bottom: 4px; text-align: center; }
.queue-card {
  width: 48px; height: 48px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; font-weight: bold;
  background: #444; color: #888; transition: all 0.3s;
}
.queue-card.active { transform: scale(1.1); box-shadow: 0 0 12px rgba(240,192,64,0.6); }

.mute-button {
  position: absolute; top: 20px; right: 20px;
  padding: 8px 10px; font-size: 1.6em;
  background-color: #1a1a2e; color: #CFF9FF;
  border-radius: 12px; border: none; cursor: pointer;
  z-index: 100;
}
.mute-button:hover { background-color: #1baf8f; color: #fff; }

  #grid {
    display: grid;
    gap: 4px;
    background: #111;
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .cell {
    width: 64px; height: 64px;
    border-radius: 8px;
    background: #222;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: bold;
    transition: background 0.15s;
  }

  #col-buttons { display: flex; gap: 4px; margin-bottom: 6px; }
  .col-btn {
    width: 64px; height: 60px; border-radius: 8px; border: none;
    background: #2a2a4a; color: #666; font-size: 1.3rem; cursor: pointer;
  }
  .col-btn.selected { background: #b3933e; color: #1a1a2e; transform: translateY(3px); }

  #pc-hint { margin-top: 12px; font-size: 0.8rem; color: #666; text-align: center; line-height: 1.6; }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    z-index: 100; padding: 20px; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 2rem; color: #f0c040; }
  #overlay .stars-result { font-size: 2.2rem; color: #f0c040; letter-spacing: 4px; }
  #restart-btn, #index-btn {
    padding: 12px 30px; border-radius: 10px; border: none;
    background: #f0c040; color: #1a1a2e; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  #index-btn { background: #2a2a4a; color: #f0c040; }

  footer { text-align: center; color: #666; font-size: 0.8rem; margin-top: 30px; }

  @keyframes merge-pop { 0%{transform:scale(1);} 50%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .merge-anim { animation: merge-pop 0.2s ease; }
  @keyframes rock-break { 0%{transform:scale(1);opacity:1;} 100%{transform:scale(1.4);opacity:0;} }
  .rock-break-anim { animation: rock-break 0.3s ease; }
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body onload="init() initLanguage()" class="ko">

<button id="lang-toggle" onclick="toggleLang()">English</button>

<button class="back-button" onclick="location.href='index.html'">←</button>
<button class="mute-button" id="mute-btn" onclick="toggleMute()">🔊</button>

<h1 id="level-title" class="lang-ko">넘스탬프</h1>
<h1 id="level-title" class="lang-en">NumStamp</h1>

<div id="status-area">
  <p class="lang-ko">남은 바위 :</p>
 <p class="lang-en">Rocks left :</p>

<span class="rocks-left" id="rocks-left">3</span></div>
<div id="queue-area">
  <div class="queue-slot">
    <div class="queue-label">
 <p class="lang-ko">다음 카드</p>
 <p class="lang-en">Next Cards</p>
</div>
    <div class="queue-card active" id="q0"></div>
  </div>
  <div class="queue-slot">
    <div class="queue-label"></div>
    <div class="queue-card" id="q1"></div>
  </div>
  <div class="queue-slot">
    <div class="queue-label"></div>
    <div class="queue-card" id="q2"></div>
  </div>
</div>

<div id="grid"></div>
<div id="col-buttons"></div>

<div id="pc-hint" class="lang-ko">
  ← → 방향키 열 선택 | 스페이스바 /엔터키 낙하<br>
</div>
<div id="pc-hint" class="lang-en">
 ← → Arrow keys to select column | Space / Enter to drop<br>
</div>
<div id="overlay">
 <h2 class="lang-ko">🎉 클리어!</h2>
 <h2 class="lang-en">🎉 Clear!</h2>
  <div class="stars-result" id="stars-result"></div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
    <button id="restart-btn">
     <p class="lang-ko">다시 도전</p>
 <p class="lang-en">Try Again</p> </button>
    <button id="index-btn" onclick="location.href='index.html'">
     <p class="lang-ko">목록으로</p>
 <p class="lang-en">As a list</p>
</button>
  </div>
</div>

<footer>© 2026 Han Soosoo. All rights reserved.</footer>

<script src="levels.js"></script>
<script>

function toggleLang() {
  const body = document.body;
  const btn = document.getElementById('lang-toggle');
  if (body.classList.contains('ko')) {
    body.classList.replace('ko', 'en');
    document.documentElement.lang = 'en';
    btn.textContent = '한국어';
    localStorage.setItem('soosoo-lang', 'en'); 
  } else {
    body.classList.replace('en', 'ko');
    document.documentElement.lang = 'ko';
    btn.textContent = 'English';
    localStorage.setItem('soosoo-lang', 'ko'); 
  }
}
  function initLanguage() {
  const saved = localStorage.getItem('soosoo-lang');
  const lang = saved || (navigator.language.startsWith('ko') ? 'ko' : 'en');
  const body = document.body;
  const btn = document.getElementById('lang-toggle');
  if (lang === 'en') {
    body.classList.replace('ko', 'en');
    document.documentElement.lang = 'en';
    btn.textContent = '한국어';
  }
}
// ── 레벨 로드 ──────────────────────────────
function getLevelId() {
  const params = new URLSearchParams(location.search);
  return params.get('id') || LEVEL_IDS[0];
}
const LEVEL_ID = getLevelId();
const level = LEVELS[LEVEL_ID];
const ROWS = level.grid.rows;
const COLS = level.grid.cols;

document.getElementById('level-title').textContent = `넘스탬프 · ${LEVEL_ID.replace('nstamp_','')}`;

// ── 색상 맵 ──────────────────────────────
const COLOR_MAP = {
  2:{bg:'#B8E986',fg:'#2F4F1F'}, 4:{bg:'#7ED957',fg:'#FFFFFF'},
  8:{bg:'#4DD0E1',fg:'#FFFFFF'}, 16:{bg:'#42A5F5',fg:'#FFFFFF'},
  32:{bg:'#7E57C2',fg:'#FFFFFF'}, 64:{bg:'#EC407A',fg:'#FFFFFF'},
  128:{bg:'#FFA726',fg:'#FFFFFF'}, 256:{bg:'#FF7043',fg:'#FFFFFF'},
  512:{bg:'#E53935',fg:'#FFFFFF'}, 1024:{bg:'#B0BEC5',fg:'#263238'}
};
function getColor(val) { return COLOR_MAP[val] || { bg:'#f0c040', fg:'#1a1a2e' }; }

// ── 사운드 (합체 시에만) ──────────────────────────────
let audioCtx = null;
let muted = false;            
function toggleMute() {          
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
  localStorage.setItem('numstamp_muted', muted ? '1' : '0');
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playMergeSound(value) {
  if (muted) return; 
  ensureAudio();
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  const baseFreq = 90 + Math.log2(value) * 12;
  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.15);
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
  osc.start(now); osc.stop(now + 0.18);

  const bufferSize = audioCtx.sampleRate * 0.05;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioCtx.createGain();
  noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
  noiseGain.gain.setValueAtTime(0.15, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  noise.start(now);
}

// ── 상태 ──────────────────────────────
let board, deckIndex, selectedCol, gameOver, rocksRemaining;
let isMobile = window.innerWidth <= 680 || 'ontouchstart' in window;

function init() {
  muted = localStorage.getItem('numstamp_muted') === '1';              
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊'; 

  gameOver = false;
  selectedCol = 0;
  deckIndex = 0;
  document.getElementById('overlay').classList.remove('show');

  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => ({ value: 0, isRock: false, rockValue: null }))
  );

  level.rocks.forEach(({ pos, value }) => {
    const [r, c] = pos;
    board[r][c] = { value: 0, isRock: true, rockValue: value };
  });
  rocksRemaining = level.rocks.length;
  document.getElementById('rocks-left').textContent = rocksRemaining;

  document.getElementById('pc-hint').style.display  = isMobile ? 'none'  : 'block';

  buildGrid();
  buildColButtons();
  renderBoard();
  updateQueueUI();
  highlightCol();
}

function nextCard() {
  const card = level.deck[deckIndex % level.deck.length];
  deckIndex++;
  return card;
}
function updateQueueUI() {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`q${i}`);
    if (!el) continue;
    const val = level.deck[(deckIndex + i) % level.deck.length];
    el.textContent = val;
    el.className = 'queue-card' + (i === 0 ? ' active' : '');
  }
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${COLS}, 64px)`;
  grid.style.gridTemplateRows = `repeat(${ROWS}, 64px)`;
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      grid.appendChild(cell);
    }
  }
}

function buildColButtons() {
  const container = document.getElementById('col-buttons');
  container.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const btn = document.createElement('button');
    btn.className = 'col-btn' + (c === selectedCol ? ' selected' : '');
    btn.textContent = '▼';
    btn.addEventListener('click', () => {
      selectedCol = c;
      highlightCol();
      if (!isMobile) return;
      dropCard();
    });
    container.appendChild(btn);
  }
}

function highlightCol() {
  document.querySelectorAll('.col-btn').forEach((btn, i) => {
    if (isMobile) {
      btn.classList.remove('selected');   
    } else {
      btn.classList.toggle('selected', i === selectedCol);  
    }
  });
}

function renderBoard(mergeSet, breakSet) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.getElementById(`cell-${r}-${c}`);
      const d = board[r][c];
      el.classList.remove('merge-anim', 'rock-break-anim');
      void el.offsetWidth;
      if (mergeSet && mergeSet.has(`${r}-${c}`)) el.classList.add('merge-anim');
      if (breakSet && breakSet.has(`${r}-${c}`)) el.classList.add('rock-break-anim');

      if (d.isRock) {
        el.style.background = '#4a4a4a';
        el.style.color = '#f0c040';
        el.style.border = '3px solid #888';
        el.textContent = d.rockValue;
      } else if (d.value > 0) {
        const col = getColor(d.value);
        el.style.background = col.bg;
        el.style.color = col.fg;
        el.style.border = 'none';
        el.textContent = d.value;
      } else {
        el.style.background = '#222';
        el.style.color = '#555';
        el.style.border = 'none';
        el.textContent = '';
      }
    }
  }
}

function dropCard() {
  if (gameOver) return;
  ensureAudio();

  const col = selectedCol;
  const cardVal = nextCard();
  updateQueueUI(); 
 
  let targetRow = -1;
  for (let r = 0; r < ROWS; r++) {
    const cell = board[r][col];
    if (cell.isRock || cell.value > 0) {
      if (r > 0 && board[r-1][col].value === 0 && !board[r-1][col].isRock) targetRow = r - 1;
      break;
    }
    if (r === ROWS - 1) targetRow = r;
  }
  if (targetRow === -1) { checkGameOver(); return; }

  board[targetRow][col] = { value: cardVal, isRock: false, rockValue: null };

  const mergeSet = new Set();
  const breakSet = new Set();
  runMergeLoop(targetRow, col, mergeSet, breakSet);

  renderBoard(mergeSet, breakSet);
  checkClear();
  checkGameOver();
}

function runMergeLoop(newR, newC, mergeSet, breakSet) {
  let changed = true;
  while (changed) {
    changed = false;
    outer:
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = board[r][c];
        if (cell.value === 0 || cell.isRock) continue;
        const val = cell.value;
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr, dc] of dirs) {
          const nr = r+dr, nc = c+dc;
          if (nr<0 || nr>=ROWS || nc<0 || nc>=COLS) continue;
          const nb = board[nr][nc];

          if (nb.isRock && nb.rockValue === val) {
            board[nr][nc] = { value: val, isRock: false, rockValue: null };
            board[r][c] = { value: 0, isRock: false, rockValue: null };
            breakSet.add(`${nr}-${nc}`);
            rocksRemaining--;
            document.getElementById('rocks-left').textContent = rocksRemaining;
            playMergeSound(val);
            changed = true;
            break outer;
          }

          if (!nb.isRock && nb.value === val) {
            const newVal = val * 2;
            board[nr][nc] = { value: newVal, isRock: false, rockValue: null };
            board[r][c] = { value: 0, isRock: false, rockValue: null };
            mergeSet.add(`${nr}-${nc}`);
            playMergeSound(newVal);
            changed = true;
            break outer;
          }
        }
      }
    }
    applyGravityAll();
  }
}

function applyGravityAll() {
  for (let c = 0; c < COLS; c++) getColumnSegments(c).forEach(seg => compactDown(c, seg));
}
function getColumnSegments(c) {
  const segments = []; let start = 0;
  for (let r = 0; r < ROWS; r++) {
    if (board[r][c].isRock) { if (r > start) segments.push({from:start,to:r-1}); start = r+1; }
  }
  if (start < ROWS) segments.push({from:start, to:ROWS-1});
  return segments;
}
function compactDown(c, {from, to}) {
  let writeRow = to;
  for (let r = to; r >= from; r--) {
    if (board[r][c].value > 0 && !board[r][c].isRock) {
      if (r !== writeRow) { board[writeRow][c] = {...board[r][c]}; board[r][c] = {value:0,isRock:false,rockValue:null}; }
      writeRow--;
    }
  }
  for (let r = writeRow; r >= from; r--) board[r][c] = {value:0,isRock:false,rockValue:null};
}

function checkClear() {
  if (rocksRemaining > 0 || gameOver) return;
  gameOver = true;

  const stars = 3; // 전부 깨야 클리어이므로 항상 3
  const prevStars = parseInt(localStorage.getItem(LEVEL_ID + '_stars') || '0', 10);
  if (stars > prevStars) localStorage.setItem(LEVEL_ID + '_stars', stars);

  document.getElementById('stars-result').textContent = '★★★';
  document.getElementById('overlay').classList.add('show');
  fireConfetti();
}

function checkGameOver() {
  if (gameOver) return;
  for (let c = 0; c < COLS; c++) {
    if (!board[0][c].isRock && board[0][c].value === 0) return;
  }
  // 판이 가득 찼는데 아직 바위가 남아있으면: 부분 점수 저장
  gameOver = true;
  const brokenCount = level.rocks.length - rocksRemaining;
  const prevStars = parseInt(localStorage.getItem(LEVEL_ID + '_stars') || '0', 10);
  if (brokenCount > prevStars) localStorage.setItem(LEVEL_ID + '_stars', brokenCount);

  document.getElementById('stars-result').textContent = '★'.repeat(brokenCount) + '☆'.repeat(level.rocks.length - brokenCount);
  document.querySelector('#overlay h2').textContent = '🪨 더 이상 놓을 곳이 없어요';
  document.getElementById('overlay').classList.add('show');
}

function fireConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;pointer-events:none;';
  document.body.appendChild(canvas);
  const myConfetti = confetti.create(canvas, { resize:true });
  myConfetti({ particleCount:120, angle:60, spread:70, origin:{x:0,y:0.7} });
  myConfetti({ particleCount:120, angle:120, spread:70, origin:{x:1,y:0.7} });
  setTimeout(() => canvas.remove(), 4000);
}

document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','Enter',' '].includes(e.key) && isMobile) {
    isMobile = false;
    document.getElementById('pc-hint').style.display = 'block';
    highlightCol();  
  }
  
  if (gameOver) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); selectedCol = Math.max(0, selectedCol-1); highlightCol(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); selectedCol = Math.min(COLS-1, selectedCol+1); highlightCol(); }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dropCard(); }
});
document.getElementById('restart-btn').addEventListener('click', init);
</script>
</body>
</html>
